spring:
  application:
    name: backend
  datasource:
    datasource:
    url: jdbc:postgresql://localhost:5432/revolut
    username: revolut
    password: ${DB_PASSWORD:revolut}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
