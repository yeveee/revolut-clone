services:
  postgres:
    image: postgres:16-alpine
    container_name: revolut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: revolut
      POSTGRES_USER: revolut
      POSTGRES_PASSWORD: revolut
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
